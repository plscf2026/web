[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' https://api.fontshare.com https://cdn.fontshare.com data:; img-src 'self' data: blob: https://images.unsplash.com https://*.supabase.co https://hnthoszbkhvygoowtvau.supabase.co; media-src 'self' blob: data: mediastream:; connect-src 'self' https://*.supabase.co https://hnthoszbkhvygoowtvau.supabase.co wss://*.supabase.co wss://hnthoszbkhvygoowtvau.supabase.co; frame-src 'self' https://api.paystation.com.bd https://sandbox.paystation.com.bd; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://api.paystation.com.bd https://sandbox.paystation.com.bd;"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Note: Netlify hosts static SPA assets from `dist/` only and does not execute
# Vercel `api/*.ts` serverless functions. Payment calls invoke Supabase Edge Function
# `verify-payment` directly rather than `/api/*` passthrough routes.

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/scanner/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/portal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/ticket/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

