# Police Lines High School & College, Faridpur Reunion 2027
# Production Nginx Hardened Configuration

server {
    listen 80;
    listen [::]:80;
    server_name reunion.policelines.edu.bd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name reunion.policelines.edu.bd;

    ssl_certificate /etc/letsencrypt/live/reunion.policelines.edu.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reunion.policelines.edu.bd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/reunion-portal/dist;
    index index.html;

    # -------------------------------------------------------------
    # Production Security Response Headers
    # -------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' https://api.fontshare.com https://cdn.fontshare.com data:; img-src 'self' data: blob: https://images.unsplash.com https://*.supabase.co https://hnthoszbkhvygoowtvau.supabase.co; connect-src 'self' https://*.supabase.co https://hnthoszbkhvygoowtvau.supabase.co wss://*.supabase.co wss://hnthoszbkhvygoowtvau.supabase.co https://api.paystation.com.bd https://sandbox.paystation.com.bd; frame-src 'self' https://api.paystation.com.bd https://sandbox.paystation.com.bd; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://api.paystation.com.bd https://sandbox.paystation.com.bd;" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # -------------------------------------------------------------
    # SPA Fallback Routing
    # -------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------
    # Static Assets Caching
    # -------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny hidden dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

